<VirtualHost *:80>
    ServerName bbs.local
    DocumentRoot /app/html

    <Directory /app/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # app/, mysql/, docs/, contrib/, assets/ are never web-served
    <DirectoryMatch "^/app/(app|mysql|docs|contrib|assets|vendor|storage)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/bbs-error.log
    CustomLog ${APACHE_LOG_DIR}/bbs-access.log combined
</VirtualHost>
